<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hello</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#0e0f11; color:#e8e8e8; }
  main { text-align:center; padding:2rem; }
  h1 { font-size:1.4rem; font-weight:600; letter-spacing:.01em; margin:0 0 .4rem; }
  p  { margin:0; color:#8b8f96; font-size:.92rem; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
         background:#39d353; margin-right:.45rem; vertical-align:middle; }
</style>
</head>
<body>
  <main>
    <h1><span class="dot"></span>it works</h1>
    <p>static page. nothing to see here.</p>
  </main>

</html>
